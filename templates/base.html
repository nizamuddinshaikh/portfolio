
{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Nizamuddin Shaikh | Portfolio{% endblock %}</title>

    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=DM+Sans:wght@400;500;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>

    <!-- Header -->
    <header class="nav">

        <a class="logo" href="{% url 'home' %}">
            Nizamuddin Shaikh
        </a>

        <!-- Navigation Menu -->
        <nav class="navbar">

            <a href="{% url 'home' %}">Home</a>

            <a href="{% url 'about' %}">About</a>

            <a href="{% url 'skills' %}">Skills</a>

            <a href="{% url 'project' %}">Projects</a>

            <a class="nav-cta" href="{% url 'contact' %}">
                Contact
            </a>

        </nav>

    </header>

    <!-- Page Content -->
    <main>
        {% block content %}
        {% endblock %}
    </main>

    <!-- Footer -->
    <footer>
        © 2026 Nizamuddin Shaikh. All Rights Reserved.
    </footer>

    <script src="{% static 'js/script.js' %}"></script>

</body>
</html>
